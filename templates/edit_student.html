<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

</head>

<body>

<div class="form-container">

<h2>Edit Student</h2>

<form method="POST">

<input type="text"
name="name"
value="{{ student[1] }}">

<input type="number"
name="age"
value="{{ student[2] }}">

<input type="text"
name="course"
value="{{ student[3] }}">

<input type="number"
name="marks"
value="{{ student[4] }}">

<input type="number"
name="attendance"
value="{{ student[5] }}">

<button type="submit">

Update Student

</button>

</form>

</div>

</body>
</html>
