<!DOCTYPE html>
<html>

<head>

    <title>Add Student</title>

    <style>

        body{
            background:#f4f7fc;
            font-family:Arial;
        }

        .form-container{

            width:400px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);

        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{

            width:100%;
            padding:12px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:10px;

        }

        button{

            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:10px;
            margin-top:20px;
            cursor:pointer;

        }

    </style>

</head>

<body>

<div class="form-container">

    <h2>Add Student</h2>

    <form method="POST">

        <input type="text"
        name="name"
        placeholder="Student Name"
        required>

        <input type="number"
        name="age"
        placeholder="Age"
        required>

        <input type="text"
        name="course"
        placeholder="Course"
        required>

        <input type="number"
        name="marks"
        placeholder="Marks"
        required>

        <input type="number"
        name="attendance"
        placeholder="Attendance %"
        required>

        <button type="submit">

            Add Student

        </button>

    </form>

</div>

</body>
</html>
