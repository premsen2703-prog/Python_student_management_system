<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<style>

body{
    background:#f4f7fc;
    font-family:Arial;
}

.form-container{

    width:350px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);

}

input{

    width:100%;
    padding:12px;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ccc;

}

button{

    width:100%;
    padding:12px;
    margin-top:20px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;

}

</style>

</head>

<body>

<div class="form-container">

<h2>Admin Login</h2>

<form method="POST">

<input type="text"
name="username"
placeholder="Username">

<input type="password"
name="password"
placeholder="Password">

<button type="submit">

Login

</button>

</form>

</div>

</body>
</html>
